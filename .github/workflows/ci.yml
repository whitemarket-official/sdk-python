name: CI

# SDK_SPEC 6.2: format, lint, types, unit tests with the 85 % coverage gate on every supported CPython (Linux) plus
# Windows and macOS on one version, codegen-check, dependency audit, secret scan, workflow lint, build.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The version of the single-version jobs (static checks, coverage gate, OS matrix, build).
  TOOLS_PYTHON: '3.13'
  # uv itself is pinned too (the lock format and `uv export` output depend on it); raised together with the pin in
  # CONTRIBUTING "Setup".
  UV_VERSION: '0.13.8'

jobs:
  static:
    name: Static checks (fmt, lint, types, codegen, audit, agent hooks, workflow lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.TOOLS_PYTHON }}
      # codegen-check regenerates the generated layer: the operation generator is Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/codegen/package-lock.json
      # From uv.lock (`uv sync --frozen`): the exact versions the lock holds, no resolution in CI.
      - run: make install PM=uv
      - run: make lock-check fmt-check lint types codegen-check audit hooks-test VERBOSE=1
      - run: make actionlint VERBOSE=1

  tests:
    name: Tests (Python ${{ matrix.python }}, ubuntu${{ matrix.python == '3.13' && ', coverage gate' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every CPython in bugfix or security status (Makefile PY_VERSIONS, https://devguide.python.org/versions/).
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      # Only what the tests need (like `make matrix`): the dev tools are not required on every version and not all
      # of them support every interpreter. `make install` runs in the static job.
      - name: Install the locked test environment
        run: UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen --extra test --extra exports --extra live
      # The coverage gate (fail_under in pyproject.toml) runs once, on the tools version; the others run the tests.
      - run: make ${{ matrix.python == '3.13' && 'coverage' || 'test' }} VERBOSE=1

  tests-os:
    name: Tests (Python 3.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # TODO(#0): put macOS back (`macos-26`, what macos-latest points to) once GitHub's macOS arm64 capacity
        # recovers; try a pull request in a few weeks, from 2026-12-01. Disabled on 2026-11-16: four jobs in a row
        # (macos-15 three times, macos-26 once) were cancelled after 15 min, "The job was not acquired by Runner of
        # type hosted even after multiple attempts", with GitHub's notice "Due to capacity constraints, jobs
        # targeting macOS arm64 runners may experience longer queue times".
        os: [windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.TOOLS_PYTHON }}
      # No make and no .venv/bin on Windows: the same two commands everywhere.
      - name: Unit tests
        shell: bash
        run: uv run --frozen --extra test --extra exports --extra live python -m pytest tests/unit

  # Proves the pip path of CONTRIBUTING "Setup": hash-pinned requirements-dev.txt and requirements-codegen.txt, no uv.
  pip-compat:
    name: Install with pip from the hashed requirements, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TOOLS_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: make install PM=pip
      - run: make lint types test VERBOSE=1

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history scan needs every commit
      # The image is pinned by tag and digest in the Makefile.
      - run: make secrets-scan secrets-scan-history VERBOSE=1

  build:
    name: Build sdist and wheel, twine check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.TOOLS_PYTHON }}
      - run: make install PM=uv
      - run: make build VERBOSE=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Mirrors the PHP SDK job: a pull request mutates only the hand-written files it changed (tools/ci/mutation_gate.py
  # lists them) and gates in that one job. Push to main and manual runs mutate everything, split into 6 parts run at
  # the same time (one job ran over 60 min on 2026-11-15); each part uploads its counts and `mutation-gate` gates their
  # sum. The gate fails below 80 %.
  mutation:
    name: Mutation tests (mutmut, ${{ github.event_name == 'pull_request' && 'changed files' || format('part {0} of 6', matrix.part) }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The parts 1..N of a full run; N is MUTATION_PARTS below and in mutation-gate (keep the three in step).
        part: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-files run diffs against the base branch, which needs the history.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.TOOLS_PYTHON }}
      - run: make install PM=uv
      - name: make mutation
        env:
          # Pull requests target main; a fixed base keeps branch names out of the command line.
          MUTATE_CHANGED: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
          MUTATE_PART: ${{ github.event_name != 'pull_request' && matrix.part || '' }}
          MUTATION_PARTS: ${{ github.event_name != 'pull_request' && '6' || '' }}
        run: make mutation VERBOSE=1
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-counts-${{ matrix.part }}
          path: var/mutation-counts/
          if-no-files-found: error
          retention-days: 7

  mutation-gate:
    name: Mutation score gate
    needs: [mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        run: echo "pull request - the mutation job gated its changed files itself"
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-counts-*
          path: var/mutation-counts/
          merge-multiple: true
      - if: github.event_name != 'pull_request'
        run: make mutation-gate MUTATION_PARTS=6

  # Single required status check for the branch ruleset: green only when every job above is green.
  ci-ok:
    name: CI OK
    if: always()
    needs: [static, tests, tests-os, pip-compat, secrets, mutation, mutation-gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
