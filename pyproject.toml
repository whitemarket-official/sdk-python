[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "whitemarket-sdk"
dynamic = ["version"]
description = "Python SDK for the WhiteMarket partner API: GraphQL, public export files, live updates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WhiteMarket" }]
# Every CPython in bugfix or security status (https://devguide.python.org/versions/, checked 2026-11-13: 3.11-3.15).
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.optional-dependencies]
exports = ["ijson>=3"]
live = ["centrifuge-python>=0.7"]
# Test runner only: what the runtime-version matrix installs.
test = [
  "coverage==7.17.3",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
]
# GraphQL codegen tool, isolated in its own venv (`make install-codegen`): ariadne-codegen 0.19.0 requires
# ruff>=0.15,<0.16, which conflicts with the ruff pin of `dev`.
codegen = ["ariadne-codegen==0.19.0"]
dev = [
  "whitemarket-sdk[test]",
  "build==1.6.1",
  "mutmut==3.8.1",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pyright==1.1.414",
  "ruff==0.17.5",
  "twine==7.0.0",
]

[project.urls]
Homepage = "https://github.com/whitemarket-official/sdk-python"
Source = "https://github.com/whitemarket-official/sdk-python"
Issues = "https://github.com/whitemarket-official/sdk-python/issues"
Changelog = "https://github.com/whitemarket-official/sdk-python/blob/main/CHANGELOG.md"

# --- build -------------------------------------------------------------------

[tool.hatch.version]
path = "src/whitemarket/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/whitemarket"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/whitemarket",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

# --- lint and format ---------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Generated by `make codegen`; checked by mypy and pyright, not reformatted or linted.
extend-exclude = ["src/whitemarket/_generated"]

[tool.ruff.format]
# ruff 0.17 also formats Python code blocks inside Markdown. The docs are shared byte-for-byte with the sister SDKs
# (SDK_SPEC.md, WHITEMARKET_API.md) or generated (schema/CHANGES.md): leave every Markdown file alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "ASYNC", "PT", "C4", "DTZ", "T20", "PL",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the pytest idiom. PLR2004: literal expected values are the point of a test.
"tests/**" = ["S101", "PLR2004"]

# --- types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

# --- tests -------------------------------------------------------------------

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source_pkgs = ["whitemarket"]
branch = true
omit = ["*/_generated/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
