[build-system]
# Exact pin: the build backend is part of the reproducible build (`make build`); raised by hand, like the other pins.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "whitemarket-sdk"
dynamic = ["version"]
description = "Python SDK for the WhiteMarket partner API: GraphQL, public export files, live updates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WhiteMarket" }]
# Every CPython in bugfix or security status (https://devguide.python.org/versions/, checked 2026-11-13: 3.11-3.15).
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  # 2.8: alias_generator with populate_by_name in the generated models, callable discriminators,
  # Field(deprecated=...) (ADR 0001); the lowest-dependency CI job checks the floor.
  "pydantic>=2.8",
  # `Secret` builds its pydantic schema with `pydantic_core.core_schema`, the documented way to write a custom
  # type (ADR 0001). Pydantic pins its own exact core version, so this carries no version bound of its own.
  "pydantic-core",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.optional-dependencies]
exports = ["ijson>=3"]
live = ["websockets>=17"]
# Test runner only: what the runtime-version matrix installs.
test = [
  "coverage==7.17.3",
  # Parses the operation documents in the selection-invariant tests (SDK_SPEC 1.2); the version the ariadne-codegen
  # environment resolves. Used by tests only, never imported by src/.
  "graphql-core==3.2.14",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  # The fake Centrifugo server of the live tests (tests/support/live_servers.py) runs on the same websockets
  # the `live` extra installs (ADR 0005); pinned exactly like every test dependency.
  "websockets==17.4",
]
# GraphQL codegen tool, isolated in its own venv (`make install-codegen`): ariadne-codegen 0.19.0 requires
# ruff>=0.15,<0.16, which conflicts with the ruff pin of `dev`; [tool.uv] conflicts below lets uv.lock hold both.
# tools/codegen/ariadne_plugin.py imports graphql-core directly, so it is declared here and not left to ariadne's own
# requirement (CLAUDE.md rule 10); the same pin as the test extra.
codegen = ["ariadne-codegen==0.19.0", "graphql-core==3.2.14"]
dev = [
  "whitemarket-sdk[test]",
  "build==1.6.1",
  # The build backend of `make build` (--no-isolation); equal to [build-system] requires (tools/ci/check_build_pin.py).
  "hatchling==1.33.0",
  "mutmut==3.8.1",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "pyright==1.1.414",
  "ruff==0.17.5",
  "twine==7.0.0",
]

[project.urls]
Homepage = "https://github.com/whitemarket-official/sdk-python"
Source = "https://github.com/whitemarket-official/sdk-python"
Issues = "https://github.com/whitemarket-official/sdk-python/issues"
Changelog = "https://github.com/whitemarket-official/sdk-python/blob/main/CHANGELOG.md"

# --- uv ----------------------------------------------------------------------

[tool.uv]
# The `codegen` extra (ruff<0.16 through ariadne-codegen) and the `dev` extra (ruff 0.17) cannot share an environment:
# uv resolves them as separate forks of uv.lock, and an environment is synced with one of them (`make install`).
conflicts = [[{ extra = "codegen" }, { extra = "dev" }]]

# --- build -------------------------------------------------------------------

[tool.hatch.version]
path = "src/whitemarket/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/whitemarket"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/whitemarket",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

# --- lint and format ---------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]
# Generated by `make codegen`; checked by mypy and pyright, not reformatted or linted.
extend-exclude = ["src/whitemarket/_generated"]

[tool.ruff.format]
# ruff 0.17 also formats Python code blocks inside Markdown. The docs are shared byte-for-byte with the sister SDKs
# (SDK_SPEC.md, WHITEMARKET_API.md) or generated (schema/CHANGES.md): leave every Markdown file alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "ASYNC", "PT", "C4", "DTZ", "T20", "PL",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the pytest idiom. PLR2004: literal expected values are the point of a test.
# PLR0913: the test rigs take one keyword per scenario knob (retry, clock, store, ...), see #0
"tests/**" = ["S101", "PLR2004", "PLR0913"]
# PLR0913: the client constructor takes every SDK_SPEC 2 option as a keyword, see #0
"src/whitemarket/_async/client.py" = ["PLR0913"]
# PLR0913: the generated twin of the async client constructor above, see #0
"src/whitemarket/_sync/client.py" = ["PLR0913"]
# E501: the usage lines of an example docstring are one command each and read better unwrapped, see #0
"examples/**" = ["E501"]
# UP028: generated sync twins of async `for ...: yield` loops (async code cannot use `yield from`), see #0
"src/whitemarket/_sync/**" = ["UP028"]
# PLR0913: `buy_cheapest` takes the SDK_SPEC 3.3 options as keywords and `_buy` one keyword per `market_buy` target, see #0
"src/whitemarket/_async/buying.py" = ["PLR0913"]
# PLR0913: the generated twin of the async buying API above, see #0
"src/whitemarket/_sync/buying.py" = ["PLR0913"]
# ASYNC109: `wait_for(..., timeout=)` is the SDK_SPEC 3.4 name and a deadline of the whole wait, not a per-await timeout, see #0
"src/whitemarket/_async/deals.py" = ["ASYNC109"]
# ASYNC109: `poll(timeout)` and `wait_for_deal_event(..., timeout)` are the SDK_SPEC 3.11 names and a deadline of the
# whole call, not a per-await timeout. PLR0913: the session takes one keyword per injected part, see #0
"src/whitemarket/live/**" = ["ASYNC109", "PLR0913"]

# --- types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]
warn_unreachable = true

[tool.pyright]
include = ["src", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

# --- tests -------------------------------------------------------------------

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
markers = ["memory: slow memory-bound streaming tests (tests/memory, make test-memory)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source_pkgs = ["whitemarket"]
branch = true
omit = ["*/_generated/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/"]
# The mutants/ copy must see what the tests import or read: tools/ (pythonpath), graphql/ and schema/ (fixtures).
also_copy = ["tools/", "graphql/", "schema/", "examples/"]
# Hand-written code only: the generated layer and the generated sync mirror are rebuilt by `make codegen`.
do_not_mutate = ["src/whitemarket/_generated/*", "src/whitemarket/_sync/*"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# Introspects the public method names of the async and sync clients; mutmut's trampolines add mutant methods
# to the mutated async side only, so the comparison is meaningless inside the mutants/ copy.
pytest_add_cli_args = ["--deselect=tests/unit/generated/test_client.py::test_the_sync_client_has_the_async_clients_methods"]
